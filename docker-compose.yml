version: '3.8'

services:
  y-language-compiler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: y-language-compiler
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - JAVA_OPTS=-Xmx1g -Xms512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/compile/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
